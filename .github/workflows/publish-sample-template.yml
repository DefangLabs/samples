name: Publish Sample Template

on:
  push:
    branches:
      - main

jobs:
  publish_samples:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          # Full history so the push's "before" SHA is reachable for the diff
          # below (a push can add several commits at once).
          fetch-depth: 0

      - name: Run Checks
        id: checks
        env:
          # Diff the whole push range, not just the tip commit, so every sample
          # touched anywhere in the push republishes its template.
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          ./scripts/check-modified-samples.sh > modified.txt
          echo "@@ MODIFIED @@"
          cat modified.txt

      - name: Install script dependencies
        run: npm ci
        working-directory: scripts

      - name: Create / Update Template Repo Main
        uses: actions/github-script@v7
        env:
          PUSH_TOKEN: ${{ secrets.TEMPLATES_MANAGER_TOKEN }}
        with:
          github-token: ${{ secrets.TEMPLATES_MANAGER_TOKEN }}
          script: |
            const script = require('./scripts/template-manager.js')
            const output = await script({github, context, core});
            console.log("@@ output", output)
