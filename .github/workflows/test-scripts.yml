name: Test Scripts

permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - "scripts/**"
      - "templates/**"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci
        working-directory: scripts

      - name: Run tests
        run: npm test
        working-directory: scripts

  preview-workflows:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci
        working-directory: scripts

      - name: Get changed samples
        run: ./scripts/check-modified-samples.sh > modified.txt

      - name: Preview workflows
        uses: actions/github-script@v7
        env:
          DRY_RUN: "true"
        with:
          script: |
            const script = require('./scripts/template-manager.js')
            await script({github, context, core});

  ci:
    name: ci
    if: always() && github.event_name == 'pull_request'
    needs: [test, preview-workflows]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require script tests and workflow preview
        env:
          TEST: ${{ needs.test.result }}
          PREVIEW: ${{ needs.preview-workflows.result }}
        run: test "$TEST" = success && test "$PREVIEW" = success
