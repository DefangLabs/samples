name: nodejs-react-postgres
services:
  app:
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - mode: ingress
        target: 3010
        published: 3010
    environment:
      - POSTGRES_PASSWORD
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3010/todos"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        reservations:
          cpus: "0.5"
          memory: 512M
    depends_on:
      - db
  db:
    image: postgres:15
    x-defang-postgres: true
    restart: unless-stopped
    environment:
      - POSTGRES_PASSWORD
    ports:
      - mode: host
        target: 5432
        published: 5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
