name: self-updating-mastra
services:
  # The production to-do app. Runs a Next.js production build with no source
  # code, no agent, and no admin UI. Exactly one ingress port keeps it
  # stateless and scale-friendly (Cloud Run on GCP, Fargate on AWS).
  app:
    restart: unless-stopped
    build:
      context: ./todo-app
      dockerfile: Dockerfile
    ports:
      - target: 3000
        published: 3000
        mode: ingress
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/postgres?sslmode=no-verify
      BETTER_AUTH_SECRET:
      ADMIN_UI: "false"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:3000/api/health
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        reservations:
          cpus: "0.5"
          memory: 1024M

  # The live "dev environment" service: Caddy in front of a Next.js dev server
  # plus a separate Hono server running the Mastra coding agent, which edits
  # the to-do app's source in place (hot reload). This service carries the full
  # sample source tree. Provider-specific IAM and runtime details live in the
  # small Compose overlay selected by `.defang/<stack>`. replicas: 1 pins it to
  # a single always-on instance so everyone previews the same edited copy.
  dev:
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - target: 3000
        published: 3000
        mode: ingress
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/postgres?sslmode=no-verify
      BETTER_AUTH_SECRET:
      ADMIN_UI: "true"
      # Break-glass token for the admin console (served by the agent server,
      # outside the app the agent edits). Lets an admin reach the console even
      # if the main app is down and their login session has expired.
      ADMIN_TOKEN:
      # Enable the admin-triggered self-redeploy. Fabric auth is a per-publish
      # interactive `defang login` (no stored token). The stack-specific env
      # file supplies the same stack/provider choice for self-redeploys.
      PUBLISH_ENABLED: "${PUBLISH_ENABLED:-false}"
      PUBLISH_PROVIDER: "${PUBLISH_PROVIDER:-}"
      PUBLISH_STACK: "${PUBLISH_STACK:-}"
      # CHAT_URL, CHAT_MODEL, and OPENAI_API_KEY (the gateway's master key)
      # are injected automatically because this service depends on the `chat`
      # model service; the coding agent reads them in agent/src/model.ts.
    depends_on:
      db:
        condition: service_healthy
      chat:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:3000/api/health
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    deploy:
      replicas: 1
      resources:
        reservations:
          cpus: "1.0"
          memory: 4096M

  # Managed LLM the coding agent talks to. The selected `.env.<cloud>` supplies
  # a provider-portable alias and the cloud-specific memory reservation. An
  # explicit service is intentional: it lets AWS use more gateway memory while
  # GCP keeps the smaller, field-tested shape.
  chat:
    provider:
      type: model
      options:
        model: ${CHAT_MODEL:-chat-default}
    x-defang-llm: true
    environment:
      OPENAI_API_KEY: defang
    deploy:
      resources:
        reservations:
          cpus: "0.5"
          memory: ${CHAT_MEMORY:-1024M}

  # Shared database: todos, users/sessions (Better Auth), feedback, and the
  # Mastra agent's storage. Both app and dev point here.
  db:
    image: postgres:16
    x-defang-postgres: true
    restart: always
    environment:
      POSTGRES_PASSWORD:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
    ports:
      - mode: host
        target: 5432
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U postgres -d postgres
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        reservations:
          cpus: "0.5"
          memory: 512M
