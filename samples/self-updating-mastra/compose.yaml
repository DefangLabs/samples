name: self-updating-mastra
services:
  # The production to-do app. Runs a Next.js production build with no source
  # code, no agent, and no admin UI. Stateless and scale-friendly — a single
  # ingress port, no live state to lose.
  app:
    restart: unless-stopped
    build:
      context: ./todo-app
      dockerfile: Dockerfile
    ports:
      - target: 3000
        published: 3000
        mode: ingress
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/postgres?sslmode=no-verify
      BETTER_AUTH_SECRET:
      ADMIN_UI: "false"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:3000/api/health
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        reservations:
          cpus: "0.5"
          memory: 1024M

  # The live "dev environment" service: Caddy in front of a Next.js dev server
  # plus a separate Hono server running the Mastra coding agent, which edits
  # the to-do app's source in place (hot reload). This service carries the full
  # sample source tree. On AWS it runs as an always-on ECS Fargate task, so its
  # working tree survives idle periods; replicas: 1 pins it to a single
  # instance so everyone previews the same edited copy.
  dev:
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - target: 3000
        published: 3000
        mode: ingress
    # Deploy permissions for the self-redeploy ("publish"): Defang creates a
    # dedicated ECS task role for this service and attaches the IAM policies
    # listed here, so the bundled Defang CLI can drive a full `defang compose
    # up` from the task role's ambient credentials — no access keys. Deploying
    # is owner-equivalent in effect (it creates IAM roles, an ECS CD task, and
    # S3/ECR artifacts), so this uses the AWS-managed AdministratorAccess
    # policy. Any code running in this container can use this role — which is
    # why the public `app` service carries none of it. For production, scope
    # this down to the specific actions Defang's CD exercises.
    x-defang-policies:
      - arn:aws:iam::aws:policy/AdministratorAccess
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/postgres?sslmode=no-verify
      BETTER_AUTH_SECRET:
      ADMIN_UI: "true"
      # Break-glass token for the admin console (served by the agent server,
      # outside the app the agent edits). Lets an admin reach the console even
      # if the main app is down and their login session has expired.
      ADMIN_TOKEN:
      # Enable the admin-triggered self-redeploy. Fabric auth is a per-publish
      # interactive `defang login` (no stored token); the target cloud
      # (provider + region) comes from the committed `.defang/<PUBLISH_STACK>`
      # stack file. PUBLISH_STACK must match the stack this project was
      # deployed with.
      PUBLISH_ENABLED: "true"
      PUBLISH_STACK: aws
      # Key for the model gateway. With a `models:` binding Defang injects
      # CHAT_URL/CHAT_MODEL but no key, and the generated LiteLLM proxy locks
      # itself to this default master key — so the agent must present exactly
      # this value (agent/src/model.ts sends OPENAI_API_KEY) or every model
      # call is rejected with a 401. Not a secret: the gateway is only
      # reachable on the project's private network.
      OPENAI_API_KEY: networkisalreadyprivate
    # Attach the managed LLM (declared under the top-level `models:` key).
    # Defang injects the gateway endpoint into CHAT_URL and the resolved model
    # id into CHAT_MODEL, which the coding agent reads (agent/src/model.ts).
    models:
      chat:
        endpoint_var: CHAT_URL
        model_var: CHAT_MODEL
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:3000/api/health
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    deploy:
      replicas: 1
      resources:
        reservations:
          cpus: "1.0"
          memory: 4096M

  # Shared database: todos, users/sessions (Better Auth), feedback, and the
  # Mastra agent's storage. Both app and dev point here.
  db:
    image: postgres:16
    x-defang-postgres: true
    restart: always
    environment:
      POSTGRES_PASSWORD:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
    ports:
      - mode: host
        target: 5432
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U postgres -d postgres
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        reservations:
          cpus: "0.5"
          memory: 512M

# Managed LLM for the coding agent, declared with the Docker Compose model
# runner syntax. `chat-default` keeps the sample provider-agnostic: Defang
# maps it to the cloud's native inference (Amazon Nova on AWS Bedrock) behind
# an OpenAI-compatible proxy, and injects the endpoint/model into any service
# that references it (see the dev service's `models:` block). The alias must be
# the bare token: an `ai/`-prefixed name is treated as already
# provider-qualified and passed through unresolved.
models:
  chat:
    model: chat-default
