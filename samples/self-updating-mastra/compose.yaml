name: self-updating-mastra
services:
  # The production to-do app. Runs a Next.js production build with no source
  # code, no agent, and no admin UI. Exactly one ingress port keeps it on the
  # serverless path (Cloud Run on GCP) — stateless and scale-friendly.
  app:
    restart: unless-stopped
    build:
      context: ./todo-app
      dockerfile: Dockerfile
    ports:
      - target: 3000
        published: 3000
        mode: ingress
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/postgres?sslmode=no-verify
      BETTER_AUTH_SECRET:
      ADMIN_UI: "false"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:3000/api/health
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        reservations:
          cpus: "0.5"
          memory: 1024M

  # The live "dev environment" service: Caddy in front of a Next.js dev server
  # plus a separate Hono server running the Mastra coding agent, which edits
  # the to-do app's source in place (hot reload). This service carries the full
  # sample source tree. The second (host-mode) port is deliberate: two ports
  # force this service off Cloud Run onto an always-on Compute Engine VM, so
  # live edits are not lost to scale-to-zero. replicas: 1 pins it to a single
  # instance so everyone previews the same edited copy.
  dev:
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - target: 3000
        published: 3000
        mode: ingress
      - target: 8081
        mode: host
    # Deploy roles for the self-redeploy ("publish"): Defang creates a
    # dedicated service account for this service and attaches it to the VM
    # with the cloud-platform scope; these project-level roles let the
    # bundled Defang CLI drive a full `defang compose up` via the metadata
    # server — no key files. This set is what the CLI's GCP driver actually
    # exercises (API enablement, CD bucket, service accounts + actAs on
    # defang-cd, Cloud Build, config listing, IAM drift repair, log tailing).
    # Note it is owner-equivalent in effect; that is inherent to what a
    # deploy does. Any code running in this container can use these roles —
    # which is why the public `app` service carries none of them.
    x-defang-roles:
      - roles/serviceusage.serviceUsageAdmin
      - roles/storage.admin
      - roles/iam.serviceAccountAdmin
      - roles/iam.serviceAccountUser
      - roles/cloudbuild.builds.editor
      - roles/resourcemanager.projectIamAdmin
      - roles/logging.viewer
      # compose up validates the stack's config by listing its Secret Manager
      # secrets; metadata-only viewer — the values are read by the CD, not us.
      - roles/secretmanager.viewer
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/postgres?sslmode=no-verify
      BETTER_AUTH_SECRET:
      ADMIN_UI: "true"
      # Break-glass token for the admin console (served by the agent server,
      # outside the app the agent edits). Lets an admin reach the console even
      # if the main app is down and their login session has expired.
      ADMIN_TOKEN:
      # Enable the admin-triggered self-redeploy. Fabric auth is a per-publish
      # interactive `defang login` (no stored token); GCP project/region are
      # discovered from the metadata server. PUBLISH_STACK must match the
      # stack this project was deployed with.
      PUBLISH_ENABLED: "true"
      PUBLISH_STACK: beta
    # Attach the managed LLM (declared under the top-level `models:` key).
    # Defang injects the gateway endpoint into CHAT_URL and the resolved model
    # id into CHAT_MODEL, which the coding agent reads (agent/src/model.ts).
    models:
      chat:
        endpoint_var: CHAT_URL
        model_var: CHAT_MODEL
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:3000/api/health
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    deploy:
      replicas: 1
      resources:
        reservations:
          cpus: "1.0"
          memory: 4096M

  # Shared database: todos, users/sessions (Better Auth), feedback, and the
  # Mastra agent's storage. Both app and dev point here.
  db:
    image: postgres:16
    x-defang-postgres: true
    restart: always
    environment:
      POSTGRES_PASSWORD:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
    ports:
      - mode: host
        target: 5432
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U postgres -d postgres
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        reservations:
          cpus: "0.5"
          memory: 512M

# Managed LLM for the coding agent, declared with the Docker Compose model
# runner syntax. `ai/chat-default` keeps the sample provider-agnostic: Defang
# maps it to the cloud's native inference (Gemini on GCP Vertex AI, Claude on
# AWS Bedrock) behind an OpenAI-compatible proxy, and injects the endpoint/model
# into any service that references it (see the dev service's `models:` block).
models:
  chat:
    model: ai/chat-default
