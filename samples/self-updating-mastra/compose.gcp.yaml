services:
  dev:
    environment:
      PUBLISH_PROVIDER: ${PUBLISH_PROVIDER}
      PUBLISH_STACK: ${PUBLISH_STACK}
    # The second, private port keeps the editable workspace on one always-on
    # Compute Engine VM instead of Cloud Run, where scale-to-zero would discard
    # live edits.
    ports:
      - target: 8081
        mode: host
    # The self-publish process uses the VM service account's ambient identity.
    # These are the project-level permissions exercised by `defang compose up`.
    x-defang-roles:
      - roles/serviceusage.serviceUsageAdmin
      - roles/storage.admin
      - roles/iam.serviceAccountAdmin
      - roles/iam.serviceAccountUser
      - roles/cloudbuild.builds.editor
      - roles/resourcemanager.projectIamAdmin
      - roles/logging.viewer
      - roles/secretmanager.viewer
      - roles/dns.reader
