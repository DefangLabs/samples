# Local development. Run with:
#   docker compose -f compose.dev.yaml up --build
#
# Same server, same Studio, but a local Postgres and a local model through
# Docker Model Runner, so no cloud account and no API key are needed.
services:
  server:
    build:
      context: ./app
      dockerfile: Dockerfile
    ports:
      - 4111:4111
    environment:
      # Plain Postgres in a container, so TLS is off.
      DATABASE_URL: postgres://postgres:postgres@db:5432/postgres?sslmode=disable
      # Local Studio should open without a login prompt. Set a token here if
      # you want to exercise the auth path the deployed sample uses.
      MASTRA_API_TOKEN: ""
    models:
      chat:
        endpoint_var: CHAT_URL
        model_var: CHAT_MODEL
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
    ports:
      - 5432:5432
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U postgres -d postgres
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - pgdata:/var/lib/postgresql/data

# Downloaded on first run. Docker Model Runner must be enabled in your Docker
# installation. This model is bigger than the usual sample default because the
# demo depends on tool calling, which the very small models do not support.
models:
  chat:
    model: ai/qwen2.5:3B-Q4_K_M

volumes:
  pgdata:
