name: mastra-server

services:
  # The Mastra server: the agent API plus the Studio UI on one port.
  # This is the same build artifact the Mastra Helm chart runs in Kubernetes.
  server:
    restart: unless-stopped
    build:
      context: ./app
      dockerfile: Dockerfile
    ports:
      - target: 4111
        published: 4111
        mode: ingress
    environment:
      # Defang injects the managed database credentials for the `db` service.
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/postgres?uselibpqcompat=true&sslmode=require
      # No value here on purpose: Defang supplies it from `defang config set`.
      # Without it the API and Studio are open to anyone who finds the URL.
      MASTRA_API_TOKEN:
    # Binds this service to the managed model below. Defang injects CHAT_URL,
    # CHAT_MODEL, and a gateway OPENAI_API_KEY. No provider API key is stored.
    models:
      chat:
        endpoint_var: CHAT_URL
        model_var: CHAT_MODEL
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:4111/health
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        reservations:
          cpus: "0.5"
          memory: 1024M

  # Durable state: threads, messages, traces, and workflow state.
  # `x-defang-postgres` swaps this image for the cloud's managed database
  # (RDS on AWS, Cloud SQL on GCP, Azure Database for PostgreSQL).
  db:
    image: postgres:16
    x-defang-postgres: true
    restart: always
    environment:
      POSTGRES_PASSWORD:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
    ports:
      - mode: host
        target: 5432
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U postgres -d postgres
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        reservations:
          cpus: "0.5"
          memory: 512M

# The managed model. Defang creates an OpenAI-compatible gateway in front of
# the cloud's own inference service — Amazon Bedrock, Google Vertex AI, or
# Microsoft Foundry — and picks the right one for the provider you deploy to.
# `chat-default` is a portable alias, so the same file works on every cloud.
models:
  chat:
    model: chat-default
