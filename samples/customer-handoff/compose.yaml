name: customer-handoff

services:
  app:
    restart: unless-stopped
    build:
      context: ./app
      dockerfile: Dockerfile
    environment:
      PORT: 8080
      PORTAL_GRAPHQL_URL: ${PORTAL_GRAPHQL_URL:-https://graphql.defang.io/v1/graphql}
    ports:
      - mode: ingress
        target: 8080
        published: 8080
    deploy:
      resources:
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
